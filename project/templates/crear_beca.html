{% extends "layout.html" %}

{% block content %}
<div class="bg-white shadow rounded-lg">
    <form method="POST" enctype="multipart/form-data">
        <div class="p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- COLUMNA 1: FOTO -->
            <div class="lg:col-span-3 flex flex-col items-center space-y-4">
                <div>
                    <div id="previewLabel" class="text-center mb-2 hidden">
                        <span class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full">
                            <i class="fa-solid fa-check-circle mr-1"></i> Vista Previa
                        </span>
                    </div>
                    <div id="previewContainer"
                        class="w-48 h-48 rounded-lg bg-slate-100 border-4 border-slate-200 shadow-md overflow-hidden relative group transition-all duration-300">
                        <img id="preview" alt="" class="w-full h-full object-cover hidden" style="display: none;">
                        <div id="placeholder" class="w-full h-full flex items-center justify-center text-slate-300">
                            <i class="fa-solid fa-user text-6xl"></i>
                        </div>
                    </div>
                </div>
                <label
                    class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition-colors">
                    <i class="fa-solid fa-camera mr-2"></i> Seleccionar Foto
                    <input type="file" name="foto" accept="image/*" class="hidden" onchange="loadFile(event)">
                </label>
            </div>

            <!-- COLUMNA 2: DATOS DEL FORMULARIO -->
            <div class="lg:col-span-9 grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- 1. IDENTIFICACIÓN Y REPRESENTANTE -->
                <div class="md:col-span-2 border-b border-slate-100 pb-4">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider flex items-center">
                            <i class="fa-solid fa-id-card mr-2"></i> Identificación
                        </h4>
                        <!-- SWITCH MENOR DE EDAD -->
                        <label class="flex items-center cursor-pointer relative">
                            <input type="checkbox" name="es_menor" id="checkMenor" class="sr-only peer"
                                onchange="toggleRepresentante()">
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all after:duration-300 peer-checked:bg-blue-600 transition-colors duration-300">
                            </div>
                            <span class="ml-3 text-sm font-medium text-gray-900 select-none">¿Es menor de
                                edad?</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="md:col-span-2"><input type="text" name="nombre" required
                                placeholder="Ej: Juan Carlos" class="w-full rounded border-slate-300 text-sm"></div>
                        <div class="md:col-span-2"><input type="text" name="apellido" required
                                placeholder="Ej: Pérez Rodríguez" class="w-full rounded border-slate-300 text-sm"></div>
                        <div><input type="text" name="cedula" required placeholder="Ej: V-12345678"
                                class="w-full rounded border-slate-300 text-sm"></div>
                        <div><input type="date" name="fecha_nacimiento" class="w-full rounded border-slate-300 text-sm"
                                title="Fecha de Nacimiento"></div>
                        <div class="md:col-span-2"><input type="text" name="lugar_nacimiento"
                                placeholder="Ej: San Juan de los Morros, Guárico"
                                class="w-full rounded border-slate-300 text-sm">
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN REPRESENTANTE -->
                <div id="divRepresentante"
                    class="md:col-span-2 border-b border-slate-100 pb-4 bg-blue-50 p-4 rounded-lg border border-blue-100 opacity-0 scale-95 transition-all duration-300 ease-in-out hidden">
                    <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3 flex items-center">
                        <i class="fa-solid fa-users mr-2"></i> Datos del Representante Legal
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-3">
                            <input type="text" name="representante_nombre" placeholder="Ej: María Rodríguez"
                                class="w-full rounded border-blue-200 text-sm">
                        </div>
                        <input type="text" name="representante_cedula" placeholder="Ej: V-9876543"
                            class="w-full rounded border-blue-200 text-sm">
                        <input type="text" name="representante_telefono" placeholder="Ej: 0414-1234567"
                            class="w-full rounded border-blue-200 text-sm">
                        <select name="representante_parentesco" class="w-full rounded border-blue-200 text-sm">
                            <option value="">Parentesco...</option>
                            <option>Madre</option>
                            <option>Padre</option>
                            <option>Abuelo/a</option>
                            <option>Tío/a</option>
                            <option>Tutor Legal</option>
                        </select>
                    </div>
                </div>

                <!-- 2. DEPORTES -->
                <div class="md:col-span-2 border-b border-slate-100 pb-4">
                    <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3">Deportes</h4>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <select name="disciplina_select" id="disciplinaSelect"
                            class="md:col-span-2 w-full rounded border-slate-300 text-sm"
                            onchange="toggleNuevaDisciplina()">
                            <option value="">Disciplina...</option>
                            {% for d in disciplinas_list %}
                            <option>{{ d }}</option>
                            {% endfor %}
                            <option value="__OTRAS__">+ Agregar Nueva Disciplina</option>
                        </select>

                        <!-- Campo oculto para nueva disciplina -->
                        <div id="nuevaDisciplinaContainer" class="md:col-span-2 hidden">
                            <input type="text" id="nuevaDisciplinaInput"
                                placeholder="Escribe el nombre del nuevo deporte..."
                                class="w-full rounded border-blue-400 text-sm bg-blue-50 font-medium">
                        </div>

                        <!-- Campo oculto real que se envía -->
                        <input type="hidden" name="disciplina" id="disciplinaHidden">

                        <input type="text" name="especialidad" placeholder="Ej: 100m Planos"
                            class="w-full rounded border-slate-300 text-sm">
                        <input type="text" name="categoria" placeholder="Ej: Juvenil A"
                            class="w-full rounded border-slate-300 text-sm">
                        <select name="tipo_beca" class="w-full rounded border-slate-300 text-sm">
                            <option value="">Programa de Beca...</option>
                            <option>Esperanza Olímpica Guariqueña</option>
                            <option>Elite Internacional</option>
                            <option>Proyección a Selección Nacional</option>
                            <option>Elite Nacional</option>
                            <option>Talento Deportivo Guariqueño</option>
                        </select>
                        <select name="estatus"
                            class="w-full rounded border-slate-300 text-sm font-medium text-blue-600">
                            <option>Activo</option>
                            <option>En Revisión</option>
                            <option>Inactivo</option>
                        </select>
                    </div>
                </div>

                <!-- 3. ANTROPOMETRÍA -->
                <div class="md:col-span-2 border-b border-slate-100 pb-4">
                    <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3">Antropometría</h4>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
                        <input type="number" name="edad" placeholder="Edad"
                            class="w-full rounded border-slate-300 text-sm">
                        <select name="sexo" class="w-full rounded border-slate-300 text-sm">
                            <option value="">Sexo</option>
                            <option>Masculino</option>
                            <option>Femenino</option>
                        </select>
                        <input type="text" name="sangre" placeholder="Ej: O+"
                            class="w-full rounded border-slate-300 text-sm">
                        <input type="text" name="peso" placeholder="Ej: 65.5 kg"
                            class="w-full rounded border-slate-300 text-sm">
                        <input type="text" name="estatura" placeholder="Ej: 1.75 m"
                            class="w-full rounded border-slate-300 text-sm">
                    </div>
                </div>

                <!-- 4. TALLAS -->
                <div class="md:col-span-2 border-b border-slate-100 pb-4">
                    <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3">Tallas / Uniformidad
                    </h4>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
                        <input type="text" name="talla_zapato" placeholder="Ej: 42"
                            class="rounded border-slate-300 text-xs text-center">
                        <input type="text" name="talla_franela" placeholder="Ej: M"
                            class="rounded border-slate-300 text-xs text-center">
                        <input type="text" name="talla_short" placeholder="Ej: M"
                            class="rounded border-slate-300 text-xs text-center">
                        <input type="text" name="talla_chemise" placeholder="Ej: M"
                            class="rounded border-slate-300 text-xs text-center">
                        <input type="text" name="talla_mono" placeholder="Ej: M"
                            class="rounded border-slate-300 text-xs text-center">
                        <input type="text" name="talla_competencia" placeholder="Ej: M"
                            class="rounded border-slate-300 text-xs text-center">
                    </div>
                </div>

                <!-- 5. INFORMACIÓN MÉDICA -->
                <div class="md:col-span-2 border-b border-slate-100 pb-4">
                    <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-3">Información Médica y
                        Otros</h4>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                        <label class="flex items-center gap-2"><select name="usa_lentes"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Usa Lentes</label>
                        <label class="flex items-center gap-2"><select name="usa_bucal"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Prot. Bucal</label>
                        <label class="flex items-center gap-2"><select name="usa_munequera"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Muñequera</label>
                        <label class="flex items-center gap-2"><select name="usa_rodilleras"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Rodilleras</label>
                        <label class="flex items-center gap-2"><select name="dieta_deportiva"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Dieta Dep.</label>
                        <label class="flex items-center gap-2"><select name="control_medico"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Ctrl. Médico</label>
                        <label class="flex items-center gap-2"><select name="estudio_social"
                                class="border-slate-300 rounded py-0 px-1">
                                <option>No</option>
                                <option>Si</option>
                            </select> Est. Social</label>
                    </div>
                </div>

                <!-- 6. CONTACTO Y UBICACIÓN -->
                <div class="md:col-span-2 pt-2">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select name="municipio" class="w-full rounded border-slate-300 text-sm">
                            <option value="">Municipio...</option>
                            {% for m in ['Roscio', 'Ortiz', 'Mellado', 'Miranda', 'Infante', 'Monagas', 'Ribas',
                            'Zaraza', 'Las Mercedes', 'El Socorro', 'Guayabal', 'Cabruta', 'Santa María de Ipire',
                            'Chaguaramas', 'San Gerónimo de Guayabal'] %}
                            <option>{{ m }}</option>
                            {% endfor %}
                        </select>
                        <input type="text" name="direccion" placeholder="Ej: Urb. Los Morros, Calle 3, Casa 15"
                            class="w-full rounded border-slate-300 text-sm">
                        <input type="text" name="telefono" placeholder="Ej: 0414-1234567"
                            class="w-full rounded border-slate-300 text-sm">
                        <input type="email" name="email" placeholder="Ej: usuario@gmail.com"
                            class="w-full rounded border-slate-300 text-sm">

                        <!-- CUENTA BANCARIA DINÁMICA -->
                        <div class="md:col-span-2">
                            <label id="labelCuenta" class="block text-xs font-bold text-slate-500 mb-1">Cuenta
                                Bancaria (Del Atleta)</label>
                            <input type="text" name="cuenta_bancaria" placeholder="0000-0000-00-0000000000"
                                class="w-full rounded border-slate-300 text-sm font-mono bg-slate-50 focus:ring-blue-500 focus:border-blue-500">
                            <p id="noteCuenta" class="text-[10px] text-slate-400 mt-1 hidden">Esta cuenta debe estar
                                a nombre del representante legal registrado arriba.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="bg-gray-50 px-4 py-3 sm:px-6 flex flex-row-reverse">
            <button type="submit"
                class="inline-flex justify-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
                ✅ Registrar Atleta
            </button>
        </div>
    </form>
</div>

<script>
    var loadFile = function (event) {
        var input = event.target;
        var file = input.files[0];
        var type = file.type;
        var output = document.getElementById('preview');
        var placeholder = document.getElementById('placeholder');
        var previewContainer = document.getElementById('previewContainer');
        var previewLabel = document.getElementById('previewLabel');

        // Simple validation
        if (!type.includes('image')) {
            alert('Por favor selecciona un archivo de imagen válido.');
            input.value = '';
            return;
        }

        output.src = URL.createObjectURL(file);
        output.onload = function () {
            URL.revokeObjectURL(output.src) // free memory
        }

        // Show image
        output.classList.remove('hidden');
        output.style.display = 'block';

        // Hide placeholder
        if (placeholder) {
            placeholder.classList.add('hidden');
            placeholder.style.display = 'none';
        }

        // Add visual feedback
        if (previewContainer) {
            previewContainer.classList.remove('border-slate-200');
            previewContainer.classList.add('border-green-500');
        }
        if (previewLabel) {
            previewLabel.classList.remove('hidden');
        }
    };

    function toggleRepresentante() {
        var check = document.getElementById('checkMenor');
        var div = document.getElementById('divRepresentante');
        var labelCuenta = document.getElementById('labelCuenta');
        var noteCuenta = document.getElementById('noteCuenta');

        if (check.checked) {
            div.classList.remove('hidden');
            // Small timeout to allow the browser to register the removal of 'hidden' before animating
            setTimeout(() => {
                div.classList.remove('opacity-0', 'scale-95');
                div.classList.add('opacity-100', 'scale-100');
            }, 10);
            labelCuenta.textContent = "Cuenta Bancaria (Del Representante)";
            labelCuenta.classList.add('text-blue-600');
            noteCuenta.classList.remove('hidden');
        } else {
            div.classList.remove('opacity-100', 'scale-100');
            div.classList.add('opacity-0', 'scale-95');
            // Wait for animation to finish before adding hidden back
            setTimeout(() => {
                if (!check.checked) div.classList.add('hidden');
            }, 300);
            labelCuenta.textContent = "Cuenta Bancaria (Del Atleta)";
            labelCuenta.classList.remove('text-blue-600');
            noteCuenta.classList.add('hidden');
        }
    }

    // Función para mostrar/ocultar campo de nueva disciplina
    function toggleNuevaDisciplina() {
        const select = document.getElementById('disciplinaSelect');
        const container = document.getElementById('nuevaDisciplinaContainer');
        const input = document.getElementById('nuevaDisciplinaInput');

        if (select.value === '__OTRAS__') {
            container.classList.remove('hidden');
            input.focus();
        } else {
            container.classList.add('hidden');
            input.value = '';
        }
    }

    // Antes de enviar el formulario, sincronizar el valor correcto
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        form.addEventListener('submit', function (e) {
            const select = document.getElementById('disciplinaSelect');
            const hiddenInput = document.getElementById('disciplinaHidden');
            const nuevaInput = document.getElementById('nuevaDisciplinaInput');

            if (select.value === '__OTRAS__') {
                // Si seleccionó "Otras", usar el valor del input de nueva disciplina
                if (nuevaInput.value.trim() === '') {
                    e.preventDefault();
                    alert('Por favor, ingresa el nombre del nuevo deporte');
                    nuevaInput.focus();
                    return false;
                }
                hiddenInput.value = nuevaInput.value.trim();
            } else {
                // Usar el valor del select normal
                hiddenInput.value = select.value;
            }
        });
    });
</script>
{% endblock %}
